name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Ubuntu runners ship Chrome at a known path. test.mjs also probes the
      # usual locations and falls back to the browser puppeteer manages, so
      # this is belt and braces rather than a requirement.
      - name: Locate Chrome
        id: chrome
        run: |
          for p in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$p" ]; then echo "path=$p" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "path=" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check README images
        run: npm run check:images

      - name: Run browser tests
        run: node test.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
