name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # puppeteer-core deliberately never downloads a browser: locally it
      # borrows the system Chrome. A runner has none, so install one. Ubuntu
      # images do carry Chrome at a known path, but pinning the download is
      # more robust than depending on the image contents staying the same.
      - name: Cache the browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ runner.os }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Puppeteer's own resolver picks a build compatible with the runner,
      # rather than pinning a version that might not suit the image.
      - name: Install a browser for the tests
        run: npx --yes puppeteer browsers install chrome

      - name: Locate the installed browser
        id: chrome
        run: |
          # Match chrome, chrome-headless-shell or a Chrome-for-Testing binary:
          # the layout differs by platform and puppeteer version.
          found=$(find "$HOME/.cache/puppeteer" -type f -perm -u+x \
                    \( -name chrome -o -name 'chrome-headless-shell' \
                       -o -name 'Google Chrome for Testing' \) 2>/dev/null | head -n1)
          if [ -z "$found" ]; then
            for p in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
              if [ -x "$p" ]; then found="$p"; break; fi
            done
          fi
          echo "Using browser: ${found:-none found}"
          echo "path=$found" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Check README images
        run: npm run check:images

      - name: Run browser tests
        run: node test.mjs 2>&1 | tee test-output.txt
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}

      # The job log needs admin rights to read through the API, which makes
      # debugging from a distance needlessly slow. The output is small, so
      # publish it only when the tests fail.
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 7
